<!DOCTYPE html>
<html>
<head>
    <title>Responsive Navigation Bar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        nav {
            background-color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .menu {
            display: flex;
            list-style: none;
        }

        .menu li {
            margin-left: 25px;
        }

        .menu a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        .menu a:hover {
            color: yellow;
        }

        .menu-btn {
            display: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
        }

        /* Mobile View */
        @media (max-width: 600px) {

            .menu-btn {
                display: block;
            }

            .menu {
                display: none;
                position: absolute;
                top: 60px;
                left: 0;
                width: 100%;
                background-color: #333;
                flex-direction: column;
                text-align: center;
            }

            .menu.active {
                display: flex;
            }

            .menu li {
                margin: 15px 0;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">HostPro</div>

        <div class="menu-btn" onclick="toggleMenu()">
            ☰
        </div>

        <ul class="menu" id="menu">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Plans</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <script>
        function toggleMenu() {
            document.getElementById("menu").classList.toggle("active");
        }
    </script>

</body>
</html>
