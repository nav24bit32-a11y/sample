<!DOCTYPE html>
<html>
<head>
    <title>Hero Section</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .hero {
            height: 500px;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .hero-content h1 {
            font-size: 50px;
            margin-bottom: 20px;
        }

        .hero-content p {
            font-size: 20px;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            margin: 5px;
            background-color: white;
            color: #1e3c72;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .btn:hover {
            background-color: #ddd;
        }
    </style>
</head>

<body>

    <section class="hero">
        <div class="hero-content">

            <h1>Fast & Reliable Web Hosting</h1>

            <p>
                Powerful, secure and affordable hosting for your website.
            </p>

            <a href="#" class="btn">Get Started</a>
            <a href="#" class="btn">View Plans</a>

        </div>
    </section>

</body>
</html>
